name: Notify search engines (IndexNow)

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in the sitemap"
        default: "yes"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Hostinger to deploy
        run: sleep 90
      - name: Submit changed URLs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ github.event.inputs.all }}
        run: python3 tools/indexnow_ping.py
